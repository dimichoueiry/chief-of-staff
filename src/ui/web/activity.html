<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activity — Chief of Staff</title>
  <link rel="stylesheet" href="/page.css" />
</head>
<body>
  <div class="window" data-page="activity">
    <main class="content">
      <div class="toolbar">
        <span class="toolbar-title">Activity</span>
        <span class="spacer"></span>
        <div class="segmented" role="tablist" aria-label="Show">
          <button class="seg" role="tab" data-tab="scheduled" aria-selected="true">Scheduled</button>
          <button class="seg" role="tab" data-tab="approvals" aria-selected="false">Approvals</button>
        </div>
      </div>
      <div class="page">
        <h1 class="large-title">Activity</h1>
        <p class="subtitle" id="state">What it's running for you, and what you've allowed.</p>
        <div id="scheduled" role="tabpanel"></div>
        <div id="approvals" role="tabpanel" hidden></div>
      </div>
    </main>
  </div>
  <script src="/dom.js"></script>
  <script src="/shell.js"></script>
  <script src="/activity.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — Chief of Staff</title>
  <link rel="stylesheet" href="/page.css" />
</head>
<body>
  <div class="window chat-window" data-page="chat">
    <aside class="chats-pane" aria-label="Your chats">
      <div class="chats-top">
        <input class="field search" id="search" type="search" placeholder="Search" aria-label="Search chats" />
        <button class="btn icon" id="new-chat" type="button" title="New chat (⌘N)" aria-label="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>
      <ul class="chat-list" id="chat-list" role="listbox" aria-label="Chats"></ul>
    </aside>

    <main class="thread-pane">
      <header class="thread-head">
        <div class="thread-title" id="thread-title">New chat</div>
        <div class="thread-sub" id="thread-sub"></div>
      </header>
      <div class="thread" id="thread" aria-live="polite">
        <div class="thread-inner" id="thread-inner"></div>
      </div>
      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Message Chief of Staff" aria-label="Message"></textarea>
          <button class="round mic" id="mic" type="button" title="Dictate" aria-label="Dictate" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zM6 11a6 6 0 0 0 12 0M12 17v4" /></svg>
          </button>
          <button class="round send" id="send" type="submit" title="Send (Return)" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg>
          </button>
        </div>
        <p class="composer-hint" id="status">Return to send · Shift-Return for a new line</p>
      </form>
    </main>
  </div>
  <script src="/dom.js"></script>
  <script src="/markdown.js"></script>
  <script src="/artifact-card.js"></script>
  <script src="/shell.js"></script>
  <script src="/chat.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goals — Chief of Staff</title>
  <link rel="stylesheet" href="/page.css" />
</head>
<body>
  <div class="window" data-page="goals">
    <main class="content" id="home">
      <div class="toolbar">
        <span class="toolbar-title" id="bar-title">Goals</span>
        <span class="spacer"></span>
      </div>
      <div class="page">
        <section id="goals">
          <h1 class="large-title">Goals</h1>
          <p class="subtitle" id="goals-state">What you're working toward.</p>
          <div id="goals-list"></div>
        </section>
        <section id="memory" hidden>
          <h1 class="large-title">Memory</h1>
          <p class="subtitle">What it knows about you, as files you can read and change. Every save is kept in its history.</p>
          <div id="memory-list"></div>
        </section>
      </div>
    </main>

    <main class="content" id="editor" hidden>
      <div class="toolbar">
        <button class="btn plain" id="back" type="button">‹ Memory</button>
        <span class="toolbar-title" id="file-bar-title" style="opacity:1"></span>
        <span class="spacer"></span>
        <div class="editor-bar" id="formatting" role="toolbar" aria-label="Formatting">
          <button data-md="bold" title="Bold (⌘B)"><b>B</b></button>
          <button data-md="italic" title="Italic (⌘I)"><i>I</i></button>
          <span class="sep"></span>
          <button data-md="h1" title="Title">H1</button>
          <button data-md="h2" title="Heading">H2</button>
          <button data-md="h3" title="Subheading">H3</button>
          <span class="sep"></span>
          <button data-md="ul" title="Bulleted list">• List</button>
          <button data-md="ol" title="Numbered list">1. List</button>
        </div>
        <div class="segmented" role="tablist" aria-label="View">
          <button class="seg" role="tab" id="mode-edit" aria-selected="true">Edit</button>
          <button class="seg" role="tab" id="mode-preview" aria-selected="false">Preview</button>
        </div>
        <button class="btn primary" id="save-btn" type="button" title="Save (⌘S)">Save</button>
      </div>
      <div class="page">
        <h1 class="large-title" id="file-title">File</h1>
        <p class="subtitle" id="file-note"></p>
        <div class="sheet">
          <textarea id="text" spellcheck="true" aria-label="File contents"></textarea>
          <article class="doc" id="preview" hidden></article>
        </div>
        <p class="status-line" id="editor-said"></p>
      </div>
    </main>
  </div>
  <script src="/dom.js"></script>
  <script src="/markdown.js"></script>
  <script src="/shell.js"></script>
  <script src="/you.js"></script>
</body>
</html>
